<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Standard Model Fields</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="art">
  <canvas id="view"></canvas>
  <div id="veil" class="veil"></div>

  <header id="brand" class="ui brand">
    <span class="mark">Standard Model</span><span class="mark it">Fields</span>
  </header>

  <nav id="corner" class="ui corner">
    <button id="sound" class="word"><span data-i18n="sound">音</span> <i id="soundState">—</i></button>
    <a id="toGuide" class="word" href="guide.html" data-i18n="guide">操作</a>
    <a id="toTheory" class="word" href="theory.html" data-i18n="theory">理論</a>
    <span id="langs" class="langs"><button data-lang="ja">ja</button><button data-lang="en">en</button><button data-lang="de">de</button></span>
  </nav>

  <nav id="topics" class="ui topics"></nav>
  <svg id="axes" class="ui axes" viewBox="-24 -24 48 48" role="button" aria-label="元の視点に戻す" data-i18n-label="reset"></svg>

  <div id="controls" class="ui controls">
    <div id="fields" class="fields"></div>
    <div id="mode" class="mode">
      <button data-mode="free" class="on" data-i18n="free">分散</button><span class="sep">/</span><button data-mode="cond" data-i18n="cond">相関</button>
    </div>
  </div>

  <div id="scrub" class="ui scrub"><div id="scrubFill" class="fill"></div><input id="time" type="range" min="0" max="1000" value="0" aria-label="時間" data-i18n-label="time"></div>

  <div id="loading" class="loading hidden"><span>…</span></div>
  <div id="error" class="error hidden"></div>

  <audio id="bgm" src="audio/drifting_prelude.ogg" loop preload="auto"></audio>

  <script src="js/volume.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
