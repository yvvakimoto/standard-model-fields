<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 190" font-family="'Cormorant Garamond','EB Garamond',Garamond,Georgia,serif">
  <!-- en。操作方法の図: 視点（マウス）と時間（キー）の操作 -->
  <defs>
    <g id="mouse">
      <rect x="-20" y="-32" width="40" height="64" rx="20" fill="none" stroke="#7f8392" stroke-width="1.5"/>
      <line x1="0" y1="-32" x2="0" y2="-6" stroke="#7f8392" stroke-width="1.5"/>
      <line x1="-20" y1="-6" x2="20" y2="-6" stroke="#7f8392" stroke-width="1.5"/>
    </g>
    <marker id="ar" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e8c98a"/></marker>
  </defs>
  <rect x="1" y="1" width="798" height="188" rx="10" fill="#07090f" stroke="#2a2f3d"/>
  <g font-size="15" letter-spacing="0.5" text-anchor="middle">
    <!-- ドラッグ: 回転 -->
    <g transform="translate(67 78)">
      <use href="#mouse"/><path d="M-19 -6 V-14 A19 19 0 0 1 0 -32 V-6 Z" fill="#e8c98a" opacity="0.85"/>
      <path d="M-34 22 A40 18 0 0 0 34 22" fill="none" stroke="#e8c98a" stroke-width="1.5" marker-end="url(#ar)"/>
      <text y="68" fill="#e9e6df">Drag</text><text y="90" fill="#7f8392">rotate</text>
    </g>
    <!-- 右ドラッグ: 平行移動 -->
    <g transform="translate(200 78)">
      <use href="#mouse"/><path d="M19 -6 V-14 A19 19 0 0 0 0 -32 V-6 Z" fill="#e8c98a" opacity="0.85"/>
      <line x1="-30" y1="22" x2="30" y2="22" stroke="#e8c98a" stroke-width="1.5" marker-start="url(#ar)" marker-end="url(#ar)"/>
      <text y="68" fill="#e9e6df">Right-drag</text><text y="90" fill="#7f8392">pan</text>
    </g>
    <!-- ホイール: 拡大 -->
    <g transform="translate(333 78)">
      <use href="#mouse"/><rect x="-3" y="-27" width="6" height="14" rx="3" fill="#e8c98a"/>
      <line x1="30" y1="-20" x2="30" y2="20" stroke="#e8c98a" stroke-width="1.5" marker-start="url(#ar)" marker-end="url(#ar)"/>
      <text y="68" fill="#e9e6df">Wheel</text><text y="90" fill="#7f8392">zoom</text>
    </g>
    <!-- ダブルクリック: 視点を戻す -->
    <g transform="translate(466 78)">
      <use href="#mouse"/><path d="M-19 -6 V-14 A19 19 0 0 1 0 -32 V-6 Z" fill="#e8c98a" opacity="0.85"/>
      <text x="-30" y="-26" font-size="12" fill="#e8c98a" font-family="Georgia,serif">×2</text>
      <text y="68" fill="#e9e6df">Double-click</text><text y="90" fill="#7f8392">reset view</text>
    </g>
    <!-- Space: 一時停止 -->
    <g transform="translate(600 78)">
      <rect x="-48" y="-16" width="96" height="30" rx="5" fill="none" stroke="#7f8392" stroke-width="1.5"/>
      <text y="5" font-size="12" fill="#e8c98a" font-family="Georgia,serif" letter-spacing="1">Space</text>
      <text y="68" fill="#e9e6df">Space</text><text y="90" fill="#7f8392">pause / play</text>
    </g>
    <!-- ← →: 1 コマ -->
    <g transform="translate(733 78)">
      <rect x="-40" y="-16" width="34" height="30" rx="5" fill="none" stroke="#7f8392" stroke-width="1.5"/>
      <rect x="6" y="-16" width="34" height="30" rx="5" fill="none" stroke="#7f8392" stroke-width="1.5"/>
      <text x="-23" y="5" font-size="14" fill="#e8c98a">←</text><text x="23" y="5" font-size="14" fill="#e8c98a">→</text>
      <text y="68" fill="#e9e6df">← →</text><text y="90" fill="#7f8392">step a frame</text>
    </g>
  </g>
</svg>
