<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="'Cormorant Garamond','EB Garamond',Garamond,Georgia,serif">
  <!-- en。操作方法の図: 描写のページの画面と、操作できる部品の番号 -->
  <defs>
    <radialGradient id="gq" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ffd0e4"/><stop offset="0.35" stop-color="#ff5fa2" stop-opacity="0.75"/><stop offset="1" stop-color="#ff5fa2" stop-opacity="0"/></radialGradient>
    <radialGradient id="gb" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#d8f1ff"/><stop offset="0.35" stop-color="#5fc8ff" stop-opacity="0.75"/><stop offset="1" stop-color="#5fc8ff" stop-opacity="0"/></radialGradient>
    <linearGradient id="gt" x1="0" x2="1"><stop offset="0" stop-color="#ff8a3d" stop-opacity="0"/><stop offset="0.5" stop-color="#ff8a3d" stop-opacity="0.45"/><stop offset="1" stop-color="#ff8a3d" stop-opacity="0"/></linearGradient>
    <linearGradient id="gs" x1="0" x2="1"><stop offset="0" stop-color="#e8c98a" stop-opacity="0"/><stop offset="1" stop-color="#e8c98a" stop-opacity="0.9"/></linearGradient>
  </defs>
  <rect x="1" y="1" width="798" height="458" rx="10" fill="#07090f" stroke="#2a2f3d"/>
  <!-- 場 -->
  <ellipse cx="400" cy="210" rx="120" ry="22" fill="url(#gt)"/>
  <circle cx="320" cy="210" r="58" fill="url(#gb)"/>
  <circle cx="480" cy="210" r="58" fill="url(#gq)"/>
  <!-- 左上・右上 -->
  <text x="28" y="36" font-size="11" letter-spacing="3.5" fill="#76777d">STANDARD MODEL<tspan dx="8" font-size="14" font-style="italic" letter-spacing="1" fill="#e8c98a">Fields</tspan></text>
  <!-- corner: 右上（en） -->
  <g font-size="14" letter-spacing="1" fill="#7f8392">
    <text x="466" y="36">sound <tspan font-size="12">on</tspan></text>
    <text x="546" y="36">controls</text>
    <text x="626" y="36">theory</text>
    <text x="710" y="36" font-size="12" font-style="italic" letter-spacing="1" font-family="Georgia,serif">ja<tspan dx="9"><tspan fill="#e8c98a">en</tspan></tspan><tspan dx="9">de</tspan></text>
  </g>
  <g font-size="13" font-family="Georgia,serif" text-anchor="middle" fill="#07090f">
    <line x1="488" y1="46" x2="488" y2="62" stroke="#e8c98a" stroke-dasharray="2 3"/><circle cx="488" cy="72" r="11" fill="#e8c98a"/><text x="488" y="77">6</text>
    <line x1="648" y1="46" x2="648" y2="62" stroke="#e8c98a" stroke-dasharray="2 3"/><circle cx="648" cy="72" r="11" fill="#e8c98a"/><text x="648" y="77">7</text>
    <line x1="737" y1="46" x2="737" y2="62" stroke="#e8c98a" stroke-dasharray="2 3"/><circle cx="737" cy="72" r="11" fill="#e8c98a"/><text x="737" y="77">9</text>
  </g>
  <!-- /corner -->
  <!-- 左下: トピック -->
  <g font-size="12" letter-spacing="0.6" fill="#7f8392">
    <text x="28" y="284" font-style="italic" fill="#e8c98a">i</text><line x1="44" y1="280" x2="68" y2="280" stroke="#e8c98a"/><text x="76" y="285" font-size="15" fill="#e9e6df">electron–electron</text>
    <text x="28" y="306" font-style="italic">ii</text><text x="52" y="306">Compton scattering</text>
    <text x="28" y="326" font-style="italic">iii</text><text x="52" y="326">beta decay</text>
    <text x="28" y="346" font-style="italic">iv</text><text x="52" y="346">neutrino oscillation</text>
    <text x="28" y="366" font-style="italic">v</text><text x="52" y="366">colour confinement</text>
    <text x="28" y="386" font-style="italic">vi</text><text x="52" y="386">pion exchange</text>
    <text x="28" y="406" font-style="italic">vii</text><text x="52" y="406">vacuum polarization</text>
  </g>
  <!-- 右下: 場と分散／相関 -->
  <g font-size="13" letter-spacing="0.4" fill="#cfcbc2" text-anchor="end">
    <text x="752" y="330">quark</text><circle cx="764" cy="326" r="3.5" fill="#ff5fa2"/>
    <text x="752" y="350">antiquark</text><circle cx="764" cy="346" r="3.5" fill="#5fc8ff"/>
    <text x="752" y="370" fill="#6a6d78">colour field</text><circle cx="764" cy="366" r="3.5" fill="none" stroke="#ff8a3d"/>
    <text x="768" y="402" font-size="18" letter-spacing="0.8"><tspan fill="#e9e6df">variance</tspan><tspan fill="#555" font-style="italic"> / </tspan><tspan fill="#7f8392">correlation</tspan></text>
  </g>
  <!-- 座標軸: 計算の箱の左下 -->
  <g transform="translate(262 268)" stroke="#fff" stroke-width="0.8" stroke-linecap="round" opacity="0.6">
    <line x2="0" y2="-11"/><line x2="9" y2="5"/><line x2="-8" y2="6"/>
  </g>
  <!-- 下: 時間 -->
  <line x1="2" y1="455" x2="430" y2="455" stroke="url(#gs)" stroke-width="2"/>
  <circle cx="430" cy="455" r="4" fill="#e8c98a"/>
  <!-- 番号 -->
  <g font-size="13" font-family="Georgia,serif" text-anchor="middle" fill="#07090f" stroke="none">
    <line x1="196" y1="338" x2="236" y2="338" stroke="#e8c98a" stroke-dasharray="2 3"/><circle cx="246" cy="338" r="11" fill="#e8c98a"/><text x="246" y="343">1</text>
    <line x1="682" y1="348" x2="642" y2="348" stroke="#e8c98a" stroke-dasharray="2 3"/><circle cx="632" cy="348" r="11" fill="#e8c98a"/><text x="632" y="353">2</text>
    <line x1="720" y1="408" x2="720" y2="420" stroke="#e8c98a" stroke-dasharray="2 3"/><circle cx="720" cy="431" r="11" fill="#e8c98a"/><text x="720" y="436">3</text>
    <line x1="430" y1="446" x2="430" y2="430" stroke="#e8c98a" stroke-dasharray="2 3"/><circle cx="430" cy="420" r="11" fill="#e8c98a"/><text x="430" y="425">4</text>
    <line x1="400" y1="150" x2="400" y2="118" stroke="#e8c98a" stroke-dasharray="2 3"/><circle cx="400" cy="108" r="11" fill="#e8c98a"/><text x="400" y="113">5</text>
    <line x1="250" y1="268" x2="222" y2="268" stroke="#e8c98a" stroke-dasharray="2 3"/><circle cx="212" cy="268" r="11" fill="#e8c98a"/><text x="212" y="273">8</text>  </g>
</svg>
